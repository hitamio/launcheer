name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-15
    environment: AppleDeveloper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate signing and notarization secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MACOS_CERTIFICATE_P12_BASE64" ]] || missing+=("MACOS_CERTIFICATE_P12_BASE64")
          [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]] || missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -n "$APPLE_ID" ]] || missing+=("APPLE_ID")
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=("APPLE_TEAM_ID")
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/launcheer-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          password="${KEYCHAIN_PASSWORD:-temporary-keychain-password}"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -k "$keychain" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"

          security find-identity -v -p codesigning "$keychain" || true
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "Developer ID Application identity was not found in the imported certificate." >&2
            echo "Export a .p12 from Keychain Access > My Certificates by selecting the Developer ID Application certificate row, not only its private key." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        shell: bash
        run: ./scripts/build_app.sh

      - name: Create DMG
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        shell: bash
        run: |
          set -euo pipefail
          app="dist/Launcheer.app"
          dmg="dist/Launcheer-${{ steps.release.outputs.version }}.dmg"
          test -d "$app"
          rm -f "$dmg"
          hdiutil create \
            -volname "Launcheer" \
            -srcfolder "$app" \
            -ov \
            -format UDZO \
            "$dmg"
          if [[ "$SIGN_IDENTITY" != "-" ]]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"
            codesign --verify --verbose=2 "$dmg"
          fi
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/Launcheer-${{ steps.release.outputs.version }}.dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          dmg="dist/Launcheer-${{ steps.release.outputs.version }}.dmg"
          notes="dist/release-notes.md"

          cat > "$notes" <<EOF
          ## Launcheer ${{ steps.release.outputs.version }}

          macOS app bundle packaged as a DMG.

          ### Install

          1. Download the DMG.
          2. Open it.
          3. Drag Launcheer.app to Applications.

          ### SHA-256

          \`\`\`
          $(cat "$dmg.sha256")
          \`\`\`
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" "$dmg.sha256" --clobber
          else
            gh release create "$tag" "$dmg" "$dmg.sha256" \
              --title "Launcheer ${{ steps.release.outputs.version }}" \
              --notes-file "$notes"
          fi
